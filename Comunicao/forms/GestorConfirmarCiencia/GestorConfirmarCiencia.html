				<div class="panel panel-primary" id="painel_identificacao">

          </div>
          <div class="panel-body">
            <div class="row">
              <div class="col-md-12 col-xs-12 form-group">

              </div>
              <div class="col-md-12 col-xs-12 form-group">

                <textarea type="textarea" class="form-control" id="observacao" name="observacao" rows="2" title="Observação" disabled></textarea>
              </div>
            </div>
          </div>
        </div>
