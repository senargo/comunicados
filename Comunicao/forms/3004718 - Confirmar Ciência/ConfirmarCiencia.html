<html>
  <head>
    <link type="text/css" rel="stylesheet" href="/style-guide/css/fluig-style-guide.min.css" />
    <script type="text/javascript" src="/portal/resources/js/jquery/jquery.js"></script>
    <script type="text/javascript" src="/portal/resources/js/jquery/jquery-ui.min.js"></script>
    <script type="text/javascript" src="/portal/resources/js/mustache/mustache-min.js"></script>
    <script type="text/javascript" src="/style-guide/js/fluig-style-guide.min.js" charset="utf-8"></script> 

    <script type="text/javascript" src="/webdesk/vcXMLRPC.js"></script>

    <script type="text/javascript" src="FluigUtils.js?v1"></script>
    <script type="text/javascript" src="custom.js?v13"></script>
    

  </head>

  <body>
    <div class="fluig-style-guide">
      <form name="form" role="form">
        <input type="hidden" id="campo_descritor" name="campo_descritor" />
        <input type="hidden" id="numero_processo" name="numero_processo" />
        <input type="hidden" id="numero_processo_pai" name="numero_processo_pai" />
        <input type="hidden" id="processo_origem" name="processo_origem" />
        <input type="hidden" id="documentos_anexos" name="documentos_anexos" />
        <input type="hidden" id="data_solicitacao" name="data_solicitacao" />
        <input type="hidden" id="data_ciencia" name="data_ciencia" />
        <input type="hidden" id="resultado" name="resultado" />
        <input type="hidden" id="observacao_negativa" name="observacao_negativa" />

        <input type="hidden" class="form-control" id="usuario_nome" name="usuario_nome" readonly />
        <input type="hidden" class="form-control" id="usuario_codigo" name="usuario_codigo" readonly />
        <input type="hidden" class="form-control" id="usuario_email" name="usuario_email" readonly />
        <input type="hidden" class="form-control" id="usuario_matricula" name="usuario_matricula" readonly />

        <div class="panel panel-primary" id="painel_identificacao">
          <div class="panel-heading">
            <h3 class="panel-title"><i class="flaticon flaticon-card-user icon-md"></i> Confirmar ciência de documento</h3>
          </div>
          <div class="panel-body">
            <div class="row">
              <div class="col-md-12 col-xs-12 form-group">
                <label for="assunto">Assunto:</label>
                <input type="text" class="form-control" id="assunto" name="assunto" disabled/>
              </div>
              <div class="col-md-12 col-xs-12 form-group">
                <label id="observacao_label" for="observacao">Observação:</label>
                <textarea type="textarea" class="form-control" id="observacao" name="observacao" rows="2" title="Observação" disabled></textarea>
              </div>
              <div class="col-md-12 col-xs-12 form-group" id="pdf-container">
                <div id="adobe-dc-view" style="width: 100%"></div>
                <script src="https://acrobatservices.adobe.com/view-sdk/viewer.js"></script>
                <script type="text/javascript">
                  document.addEventListener("adobe_dc_view_sdk.ready", function()
                  {
                      adobeDCView = new AdobeDC.View({clientId: "5d4181db4f854cd7a4d999cb0718782c", divId: "adobe-dc-view"});
                      // teste efdc0c242678444b92ebbdc305d751d2
                  });
                </script>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </body>
</html>
